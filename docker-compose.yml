services:
  postgres:
    image: postgres:17
    container_name: desafio-tecnico-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: noticias
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: desafio-tecnico-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/noticias?schema=public
    depends_on:
      - postgres

volumes:
  postgres_data: